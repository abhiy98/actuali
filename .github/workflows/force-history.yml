name: Force History Patch

on:
  push:
    branches: [History]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(history):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: History
          fetch-depth: 0

      - name: Apply History implementation
        run: python3 .github/force_history.py

      - name: Commit History implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(history): add local history and undo"
          git push origin HEAD:History

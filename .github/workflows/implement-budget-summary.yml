name: Implement budget summary flow

on:
  push:
    branches:
      - Hold-To-Budget-for-next-month-and-reset-the-buffer

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement budget summary flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          db_path = Path('Actuali/Actuali/Services/Database/BudgetDatabase.swift')
          store_path = Path('Actuali/Actuali/Services/BudgetStore.swift')
          view_path = Path('Actuali/Actuali/Views/Budget/BudgetView.swift')
          buffer_path = Path('Actuali/Actuali/Views/Budget/BudgetBufferSheet.swift')

          db = db_path.read_text()
          marker = '    // MARK: - Notes\n'
          assert marker in db, 'BudgetDatabase notes marker not found'
          db_insert = r'''    /// Exact envelope-budget summary values used by the PWA's To Budget popup.
          /// These are derived from the same budget walk as `fetchBudgetMonth`, including
          /// automatic income buffering when no manual buffer overrides it.
          struct EnvelopeBudgetSummary: Equatable {
              let availableFunds: Int
              let lastMonthOverspent: Int
              let totalBudgeted: Int
              let buffered: Int
              let toBudget: Int
          }

          func fetchEnvelopeBudgetSummary(month: String) async throws -> EnvelopeBudgetSummary? {
              try await dbQueue.read { db in
                  let targetMonthInt = Self.monthStringToInt(month)
                  guard targetMonthInt > 0 else { return nil }
                  let walk = try Self.budgetWalk(db, targetMonthInt: targetMonthInt)
                  guard walk.isEnvelope else { return nil }

                  let targetBudgets = walk.budgetByMonthCat[targetMonthInt] ?? [:]
                  let targetSpent = walk.spentByMonthCat[targetMonthInt] ?? [:]
                  let manualBuffered: Int = {
                      guard (try? db.tableExists("zero_budget_months")) == true else { return 0 }
                      return (try? Int.fetchOne(
                          db,
                          sql: "SELECT buffered FROM zero_budget_months WHERE id = ?",
                          arguments: [month]
                      )) ?? 0
                  }()

                  var totalIncome = 0
                  var bufferedAuto = 0
                  for catId in walk.incomeCatIds {
                      let amount = targetSpent[catId] ?? 0
                      totalIncome += amount
                      if targetBudgets[catId]?.flag == true {
                          bufferedAuto += amount
                      }
                  }
                  let buffered = manualBuffered != 0 ? manualBuffered : bufferedAuto

                  let previousMonthInt = Self.previousMonthInt(targetMonthInt)
                  let previousLeftover = walk.leftoverByMonthCat[previousMonthInt] ?? [:]
                  let previousBudgets = walk.budgetByMonthCat[previousMonthInt] ?? [:]
                  let expenseCatIds = walk.categories
                      .filter { $0.isIncome != 1 }
                      .map { $0.id }
                  var lastMonthOverspent = 0
                  for catId in expenseCatIds {
                      if !(previousBudgets[catId]?.flag ?? false) {
                          lastMonthOverspent += min(0, previousLeftover[catId] ?? 0)
                      }
                  }

                  var totalBudgeted = 0
                  for catId in expenseCatIds {
                      totalBudgeted += targetBudgets[catId]?.amount ?? 0
                  }

                  let toBudget = walk.toBudget
                  // PWA formula: to-budget = available-funds + last-month-overspent
                  // - budgeted - buffered. Solve for available-funds so the popup
                  // reconciles exactly to the displayed To Budget value.
                  let availableFunds = toBudget - lastMonthOverspent + totalBudgeted + buffered

                  _ = totalIncome // Kept intentionally: documents the upstream decomposition.
                  return EnvelopeBudgetSummary(
                      availableFunds: availableFunds,
                      lastMonthOverspent: lastMonthOverspent,
                      totalBudgeted: totalBudgeted,
                      buffered: buffered,
                      toBudget: toBudget
                  )
              }
          }

'''
          # The budget walker already exposes its own numeric month helpers indirectly;
          # add a tiny private converter beside the summary method for this one lookup.
          db_insert = db_insert.replace('let previousMonthInt = Self.previousMonthInt(targetMonthInt)', 'let previousMonthInt = Self.monthStringToInt(Self.previousMonthString(month))')
          helper = r'''    private static func previousMonthString(_ month: String) -> String {
              let parts = month.split(separator: "-")
              guard parts.count == 2,
                    let year = Int(parts[0]),
                    let monthNumber = Int(parts[1]),
                    monthNumber >= 1, monthNumber <= 12
              else { return month }
              if monthNumber == 1 {
                  return String(format: "%04d-12", year - 1)
              }
              return String(format: "%04d-%02d", year, monthNumber - 1)
          }

'''
          assert 'previousMonthString' not in db, 'summary helper already exists'
          db = db.replace(marker, db_insert + helper + marker, 1)
          db_path.write_text(db)

          store = store_path.read_text()
          marker = '    /// Hold part or all of this envelope month\'s To Budget for next month.\n'
          assert marker in store, 'BudgetStore hold marker not found'
          wrapper = r'''    /// Load the exact envelope-budget summary used by the To Budget popup.
          func fetchEnvelopeBudgetSummary(month: String) async -> BudgetDatabase.EnvelopeBudgetSummary? {
              guard let database else { return nil }
              do {
                  return try await database.fetchEnvelopeBudgetSummary(month: month)
              } catch {
                  self.error = error.localizedDescription
                  return nil
              }
          }

'''
          store = store.replace(marker, wrapper + marker, 1)
          store_path.write_text(store)

          view = view_path.read_text()
          old = '''                if let toBudget = budget.toBudget {
                      SummaryStat(
                          label: "To Budget",
                          value: budgetStore.displayBalance(toBudget),
                          valueColor: toBudget >= 0 ? .green : .red,
                          alignment: .trailing
                      )
                  } else {
'''
          new = '''                if let toBudget = budget.toBudget {
                      SummaryStat(
                          label: "To Budget",
                          value: budgetStore.displayBalance(toBudget),
                          budget: budget,
                          valueColor: toBudget >= 0 ? .green : .red,
                          alignment: .trailing
                      )
                  } else {
'''
          assert old in view, 'CleanBudgetSummary envelope block not found'
          view = view.replace(old, new, 1)

          start = view.index('struct SummaryStat: View {')
          end = view.index('/// Clean section header with collapse and visibility controls.', start)
          replacement = r'''struct SummaryStat: View {
              @EnvironmentObject private var budgetStore: BudgetStore
              @State private var showingSummary = false
              let label: String
              let value: String
              var budget: BudgetMonth? = nil
              var valueColor: Color = .primary
              var alignment: HorizontalAlignment = .leading

              private var displayedLabel: String {
                  guard let toBudget = budget?.toBudget else { return label }
                  return toBudget < 0 ? "Overbudgeted" : "To Budget"
              }

              var body: some View {
                  VStack(alignment: alignment) {
                      Text(displayedLabel)
                          .font(.caption)
                          .foregroundStyle(.secondary)
                      if budget?.toBudget != nil {
                          Button {
                              showingSummary = true
                          } label: {
                              Text(value)
                                  .font(.headline)
                                  .foregroundColor(valueColor)
                                  .lineLimit(1)
                                  .minimumScaleFactor(0.7)
                                  .animatedAmount(value)
                          }
                          .buttonStyle(.plain)
                          .accessibilityIdentifier("budgetToBudgetAction")
                      } else {
                          Text(value)
                              .font(.headline)
                              .foregroundColor(valueColor)
                              .lineLimit(1)
                              .minimumScaleFactor(0.7)
                              .animatedAmount(value)
                      }
                  }
                  .sheet(isPresented: $showingSummary) {
                      if let budget {
                          BudgetSummarySheet(month: budget.month)
                      }
                  }
              }
          }

          '''
          view = view[:start] + replacement + view[end:]
          view_path.write_text(view)

          buffer = buffer_path.read_text()
          start = buffer.index('/// Compact budget summary\'s interactive To Budget cell.')
          replacement = r'''/// Compact budget summary's interactive To Budget / Overbudgeted cell.
          struct BudgetBufferCompactSummaryStat: View {
              @EnvironmentObject private var budgetStore: BudgetStore
              @Environment(\.dynamicTypeSize) private var dynamicTypeSize
              @Environment(\.locale) private var locale
              @State private var showingSummary = false

              let stat: CompactBudgetOverview.Stat
              var alignment: HorizontalAlignment = .trailing

              private var displayedLabel: String {
                  stat.amount < 0
                      ? String(localized: "Overbudgeted", locale: locale)
                      : String(localized: "To Budget", locale: locale)
              }

              var body: some View {
                  VStack(alignment: alignment, spacing: 2) {
                      Text(displayedLabel)
                          .font(.caption)
                          .foregroundStyle(.secondary)
                          .lineLimit(dynamicTypeSize.isAccessibilitySize ? nil : 1)
                          .minimumScaleFactor(dynamicTypeSize.isAccessibilitySize ? 1 : 0.65)
                          .allowsTightening(!dynamicTypeSize.isAccessibilitySize)
                          .fixedSize(horizontal: false, vertical: dynamicTypeSize.isAccessibilitySize)
                      Button {
                          showingSummary = true
                      } label: {
                          Text(budgetStore.displayBudgetCell(stat.amount))
                              .font(.footnote.weight(.semibold))
                              .monospacedDigit()
                              .lineLimit(1)
                              .minimumScaleFactor(dynamicTypeSize.isAccessibilitySize ? 1 : 0.35)
                              .allowsTightening(!dynamicTypeSize.isAccessibilitySize)
                              .foregroundStyle(resultColor)
                              .animatedAmount(budgetStore.displayBudgetCell(stat.amount))
                      }
                      .buttonStyle(.plain)
                  }
                  .sheet(isPresented: $showingSummary) {
                      if let budget = budgetStore.currentBudgetMonth,
                         budget.toBudget != nil {
                          BudgetSummarySheet(month: budget.month)
                      }
                  }
              }

              private var resultColor: Color {
                  switch CompactBalanceTone(amount: stat.amount, isMasked: budgetStore.hideBalances) {
                  case .negative: return .red
                  case .zero: return .secondary
                  case .positive: return .green
                  case .masked: return .primary
                  }
              }
          }

          /// Budget summary popup for an envelope budget's To Budget / Overbudgeted figure.
          struct BudgetSummarySheet: View {
              @EnvironmentObject private var budgetStore: BudgetStore
              @Environment(\.dismiss) private var dismiss
              @State private var summary: BudgetDatabase.EnvelopeBudgetSummary?
              @State private var showingActions = false
              @State private var showingCategorySheet = false
              @State private var showingHoldSheet = false

              let month: String

              var body: some View {
                  NavigationStack {
                      Group {
                          if let summary {
                              Form {
                                  Section {
                                      summaryRow("Available Funds", summary.availableFunds)
                                      summaryRow("Overspent in previous month", summary.lastMonthOverspent, tint: summary.lastMonthOverspent < 0 ? .red : .primary)
                                      summaryRow("Budgeted", -summary.totalBudgeted, tint: summary.totalBudgeted > 0 ? .primary : .secondary)
                                      summaryRow("For next month", -summary.buffered, tint: summary.buffered > 0 ? .primary : .secondary)
                                  }

                                  Section {
                                      Button {
                                          showingActions = true
                                      } label: {
                                          LabeledContent(
                                              summary.toBudget < 0 ? "Overbudgeted" : "To Budget",
                                              value: budgetStore.displayBalance(summary.toBudget)
                                          )
                                          .foregroundStyle(summary.toBudget < 0 ? .red : .green)
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                          } else {
                              ProgressView()
                                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                          }
                      }
                      .navigationTitle("Budget Summary")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Done") { dismiss() }
                          }
                      }
                  }
                  .task(id: month) {
                      summary = await budgetStore.fetchEnvelopeBudgetSummary(month: month)
                  }
                  .confirmationDialog(
                      summary.map { $0.toBudget < 0 ? "Overbudgeted" : "To Budget" } ?? "Budget Summary",
                      isPresented: $showingActions,
                      titleVisibility: .visible
                  ) {
                      if let summary {
                          if summary.toBudget > 0 {
                              Button("Move to a category") { showingCategorySheet = true }
                              if budgetStore.currentBudgetMonth?.buffered ?? 0 > 0 {
                                  Button("Reset next month's buffer") {
                                      Task { try? await budgetStore.resetBudgetBuffer(month: month) }
                                  }
                              } else {
                                  Button("Hold for next month") { showingHoldSheet = true }
                              }
                          } else if summary.toBudget < 0 {
                              Button("Cover from a category") { showingCategorySheet = true }
                          }
                          Button("Cancel", role: .cancel) {}
                      }
                  }
                  .sheet(isPresented: $showingHoldSheet) {
                      if let summary, summary.toBudget > 0 {
                          BudgetBufferSheet(month: month, available: summary.toBudget)
                      }
                  }
                  .sheet(isPresented: $showingCategorySheet) {
                      if let current = budgetStore.currentBudgetMonth,
                         let toBudget = current.toBudget {
                          BudgetToCategorySheet(
                              budget: current,
                              amount: toBudget,
                              isCovering: toBudget < 0
                          )
                      }
                  }
              }

              @ViewBuilder
              private func summaryRow(_ title: String, _ amount: Int, tint: Color = .primary) -> some View {
                  HStack {
                      Text(title)
                      Spacer()
                      Text(budgetStore.displayBalance(amount))
                          .monospacedDigit()
                          .foregroundStyle(tint)
                  }
              }
          }

          /// Move positive To Budget into a category, or cover a negative To Budget
          /// from a category. The write uses the same nil-category transfer path as
          /// the existing category move-money sheet, keeping both flows sync-compatible.
          struct BudgetToCategorySheet: View {
              @EnvironmentObject private var budgetStore: BudgetStore
              @Environment(\.dismiss) private var dismiss
              @Environment(\.locale) private var locale

              let budget: BudgetMonth
              let amount: Int
              let isCovering: Bool
              @State private var selectedCategoryId: String
              @State private var amountText: String
              @State private var errorMessage: String?
              @State private var isSaving = false

              init(budget: BudgetMonth, amount: Int, isCovering: Bool) {
                  self.budget = budget
                  self.amount = abs(amount)
                  self.isCovering = isCovering
                  let candidates = budget.categoryBudgets.filter { isCovering ? $0.available > 0 : true }
                  _selectedCategoryId = State(initialValue: candidates.first?.categoryId ?? "")
                  _amountText = State(initialValue: String(format: "%.2f", Double(abs(amount)) / 100.0))
              }

              private var candidates: [CategoryBudget] {
                  budget.categoryBudgets.filter { isCovering ? $0.available > 0 : true }
              }

              var body: some View {
                  NavigationStack {
                      Form {
                          if candidates.isEmpty {
                              Section {
                                  Text(isCovering
                                      ? "There are no categories with available funds to cover this overbudgeted amount."
                                      : "There are no categories available to move this money into.")
                                      .foregroundStyle(.secondary)
                              }
                          } else {
                              Section {
                                  Picker(isCovering ? "From" : "To", selection: $selectedCategoryId) {
                                      ForEach(candidates, id: \\.categoryId) { category in
                                          Text("\(category.categoryName) (\(budgetStore.displayBalance(category.available)))")
                                              .tag(category.categoryId)
                                      }
                                  }

                                  AmountInputField(
                                      text: $amountText,
                                      conventionalAmountEntry: budgetStore.conventionalAmountEntry,
                                      allowsNegative: false,
                                      autofocus: true
                                  )
                              } header: {
                                  Text(isCovering ? "Cover from a category" : "Move to a category")
                              }

                              if let errorMessage {
                                  Section {
                                      Text(errorMessage)
                                          .foregroundStyle(.red)
                                  }
                              }
                          }
                      }
                      .navigationTitle(isCovering ? "Cover Overbudgeted" : "Move to Category")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) {
                              Button("Cancel") { dismiss() }
                          }
                          ToolbarItem(placement: .confirmationAction) {
                              Button(isCovering ? "Cover" : "Move") { save() }
                                  .disabled(isSaving || candidates.isEmpty)
                          }
                      }
                  }
                  .presentationDetents([.medium, .large])
                  .interactiveDismissDisabled(isSaving)
              }

              private func save() {
                  guard !isSaving else { return }
                  errorMessage = nil
                  isSaving = true
                  Task {
                      do {
                          let cents = try BudgetStore.budgetAmountCents(from: amountText)
                          guard cents > 0 else { throw BudgetStoreError.invalidAmount }
                          guard let category = candidates.first(where: { $0.categoryId == selectedCategoryId }) else {
                              throw BudgetStoreError.invalidAmount
                          }
                          if isCovering {
                              guard cents <= category.available else {
                                  throw BudgetStoreError.transferAmountExceedsSource
                              }
                              try await budgetStore.transferBudget(
                                  month: budget.month,
                                  fromCategoryId: category.categoryId,
                                  toCategoryId: nil,
                                  amountCents: cents
                              )
                          } else {
                              guard cents <= amount else {
                                  throw BudgetStoreError.invalidAmount
                              }
                              try await budgetStore.transferBudget(
                                  month: budget.month,
                                  fromCategoryId: nil,
                                  toCategoryId: category.categoryId,
                                  amountCents: cents
                              )
                          }
                          dismiss()
                      } catch {
                          errorMessage = error.localizedDescription
                          isSaving = false
                      }
                  }
              }
          }
          '''
          buffer = buffer[:start] + replacement
          buffer_path.write_text(buffer)
          
          # Make the dynamic compact label work in the accessibility/compact header.
          comp_path = Path('Actuali/Actuali/Views/Budget/CompactBudgetPresentation.swift')
          comp = comp_path.read_text()
          old = '            case .toBudget: ReportStrings.text("To Budget", locale: locale, bundle: bundle)\n'
          new = '            case .toBudget: ReportStrings.text("To Budget", locale: locale, bundle: bundle)\n'
          assert old in comp, 'CompactBudgetPresentation toBudget label missing'
          # Leave the semantic kind intact; the interactive renderer supplies the sign-aware label.
          comp_path.write_text(comp)
          
          print('Budget summary implementation applied')
          PY

      - name: Commit changes
        run: |
          git config user.name "abhiy98"
          git config user.email "69753977+abhiy98@users.noreply.github.com"
          git add Actuali/Actuali/Services/Database/BudgetDatabase.swift Actuali/Actuali/Services/BudgetStore.swift Actuali/Actuali/Views/Budget/BudgetView.swift Actuali/Actuali/Views/Budget/BudgetBufferSheet.swift
          git commit -m "Add To Budget summary and actions"
          git push origin HEAD:Hold-To-Budget-for-next-month-and-reset-the-buffer

      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/implement-budget-summary.yml
          git commit -m "Remove one-shot budget summary workflow"
          git push origin HEAD:Hold-To-Budget-for-next-month-and-reset-the-buffer

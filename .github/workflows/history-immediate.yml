name: History immediate update

on:
  push:
    branches: [History]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'abhiy98'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Actuali/Actuali/Services/BudgetStore.swift')
          text = path.read_text()
          old = '''    /// Create a new transaction (optimistic local-first)\n    func createTransaction(_ transaction: Transaction) async throws {\n        guard let syncClient else {\n            throw BudgetStoreError.syncNotConfigured\n        }\n\n        try await syncClient.createTransaction(transaction)\n\n        // Refresh local data (without recreating SyncClient, which would cancel the scheduled sync)\n        await refreshDataOnly()\n    }'''
          new = '''    /// Create a new transaction (optimistic local-first)\n    func createTransaction(_ transaction: Transaction) async throws {\n        guard let syncClient else {\n            throw BudgetStoreError.syncNotConfigured\n        }\n\n        try await syncClient.createTransaction(transaction)\n\n        // Publish the persisted row before the full refresh so local observers\n        // such as History see the transaction immediately.\n        if let database, let saved = try? await database.fetchTransaction(id: transaction.id) {\n            transactions.removeAll { $0.id == saved.id }\n            transactions.append(saved)\n        }\n\n        // Refresh local data (without recreating SyncClient, which would cancel the scheduled sync)\n        await refreshDataOnly()\n    }'''
          if old not in text:
              raise SystemExit('createTransaction block not found')
          if text.count(old) != 1:
              raise SystemExit('createTransaction block matched more than once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- Actuali/Actuali/Services/BudgetStore.swift
      - name: Commit and remove workflow
        run: |
          git config user.name 'abhiy98'
          git config user.email '69753977+abhiy98@users.noreply.github.com'
          git add Actuali/Actuali/Services/BudgetStore.swift .github/workflows/history-immediate.yml
          git commit -m 'Show new transactions in history immediately'
          git rm .github/workflows/history-immediate.yml
          git commit --amend --no-edit
          git push --force origin HEAD:History

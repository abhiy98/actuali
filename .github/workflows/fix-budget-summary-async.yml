name: Fix budget summary async read
on:
  push:
    branches:
      - Hold-To-Budget-for-next-month-and-reset-the-buffer
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix async previous month read
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Actuali/Actuali/Views/Budget/BudgetBufferSheet.swift')
          s = p.read_text()
          old = '''        let previousMonth = BudgetStore.shiftBudgetMonth(month, by: -1)\n        let previous = previousMonth.flatMap { previousMonth in\n            // This call is safe because fetchBudgetMonthSnapshot is explicitly\n            // non-mutating: it never changes the month currently shown on screen.\n            return await budgetStore.fetchBudgetMonthSnapshot(previousMonth)\n        }\n'''
          new = '''        let previousMonth = BudgetStore.shiftBudgetMonth(month, by: -1)\n        let previous: BudgetMonth?\n        if let previousMonth {\n            // This call is safe because fetchBudgetMonthSnapshot is explicitly\n            // non-mutating: it never changes the month currently shown on screen.\n            previous = await budgetStore.fetchBudgetMonthSnapshot(previousMonth)\n        } else {\n            previous = nil\n        }\n'''
          assert s.count(old) == 1, 'Expected async previous-month block exactly once'
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "abhiy98"
          git config user.email "69753977+abhiy98@users.noreply.github.com"
          git add Actuali/Actuali/Views/Budget/BudgetBufferSheet.swift
          git commit -m "Fix async budget summary month lookup"
          git push origin HEAD:Hold-To-Budget-for-next-month-and-reset-the-buffer
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/fix-budget-summary-async.yml
          git commit -m "Remove async budget summary fix workflow"
          git push origin HEAD:Hold-To-Budget-for-next-month-and-reset-the-buffer

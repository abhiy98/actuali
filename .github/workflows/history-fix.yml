name: Apply History fixes

on:
  push:
    branches: [History]
    paths:
      - .github/workflows/history-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: History
          fetch-depth: 0
      - name: Patch History implementation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Actuali/Actuali/Services/BudgetStore.swift")
          text = path.read_text()

          old = '''        try await syncClient.createTransfer(source: source, target: target)\n        await refreshDataOnly()\n'''
          new = '''        try await syncClient.createTransfer(source: source, target: target)\n        await publishTransactionsImmediately([sourceId, targetId])\n        await refreshDataOnly()\n'''
          assert old in text, "createTransfer block not found"
          text = text.replace(old, new, 1)

          old = '''            try await syncClient.createSplit(parent: parent, children: children)\n            await refreshDataOnly()\n'''
          new = '''            try await syncClient.createSplit(parent: parent, children: children)\n            await publishTransactionsImmediately([parent.id] + children.map(\\.id))\n            await refreshDataOnly()\n'''
          assert old in text, "createSplit block not found"
          text = text.replace(old, new, 1)

          old = '''    /// Update an existing transaction (optimistic local-first)\n    func updateTransaction(_ updated: Transaction, original: Transaction) async throws {\n        guard let syncClient else {\n            throw BudgetStoreError.syncNotConfigured\n        }\n\n        let changedFields = Self.changedFields(original: original, updated: updated)\n        try await syncClient.updateTransaction(updated, changedFields: changedFields)\n        await refreshDataOnly()\n    }\n\n'''
          new = '''    /// Update an existing transaction (optimistic local-first)\n    func updateTransaction(_ updated: Transaction, original: Transaction) async throws {\n        guard let syncClient else {\n            throw BudgetStoreError.syncNotConfigured\n        }\n\n        let changedFields = Self.changedFields(original: original, updated: updated)\n        try await syncClient.updateTransaction(updated, changedFields: changedFields)\n        await refreshDataOnly()\n    }\n\n    /// Restore several transaction rows as one sync write. History uses this\n    /// for multi-row Undo so a transfer or split does not intentionally issue\n    /// one independent write per leg.\n    func restoreTransactions(\n        _ transactions: [Transaction],\n        from recordedAfter: [Transaction]\n    ) async throws {\n        guard let syncClient else {\n            throw BudgetStoreError.syncNotConfigured\n        }\n        guard transactions.count == recordedAfter.count else {\n            throw BudgetStoreError.syncNotConfigured\n        }\n\n        var changedFields = Set<String>()\n        for (updated, original) in zip(transactions, recordedAfter) {\n            changedFields.formUnion(Self.changedFields(original: original, updated: updated))\n        }\n        guard !changedFields.isEmpty else { return }\n\n        try await syncClient.updateTransactions(\n            transactions,\n            changedFields: Array(changedFields)\n        )\n        await refreshDataOnly()\n    }\n\n    /// Publish rows that have just been committed before the normal refresh.\n    /// History observes `transactions`, so this keeps every creation shape\n    /// consistent without changing the database's authoritative read path.\n    private func publishTransactionsImmediately(_ ids: [String]) async {\n        guard let database else { return }\n        for id in ids {\n            guard let saved = try? await database.fetchTransaction(id: id) else { continue }\n            transactions.removeAll { $0.id == saved.id }\n            transactions.append(saved)\n        }\n    }\n\n'''
          assert old in text, "updateTransaction block not found"
          text = text.replace(old, new, 1)

          # Reuse the persisted-state definition already used by HistoryStore\n          # and exclude insert-only fields that the normal fetch path cannot\n          # reproduce.
          old = '''    private static func samePersistedState(_ lhs: Transaction, _ rhs: Transaction) -> Bool {\n        lhs.id == rhs.id &&\n        lhs.accountId == rhs.accountId &&\n        lhs.date == rhs.date &&\n        lhs.amount == rhs.amount &&\n        lhs.payeeId == rhs.payeeId &&\n        lhs.categoryId == rhs.categoryId &&\n        lhs.notes == rhs.notes &&\n        lhs.cleared == rhs.cleared &&\n        lhs.reconciled == rhs.reconciled &&\n        lhs.transferId == rhs.transferId &&\n        lhs.isParent == rhs.isParent &&\n        lhs.parentId == rhs.parentId &&\n        lhs.tombstone == rhs.tombstone &&\n        lhs.importedPayee == rhs.importedPayee &&\n        lhs.schedule == rhs.schedule &&\n        lhs.financialId == rhs.financialId &&\n        lhs.startingBalanceFlag == rhs.startingBalanceFlag\n    }\n'''
          # This block is in HistoryObserver.swift, so leave BudgetStore alone here.
          path.write_text(text)
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path("Actuali/Actuali/Services/HistoryObserver.swift")
          text = path.read_text()
          old = '''    private static func samePersistedState(_ lhs: Transaction, _ rhs: Transaction) -> Bool {\n        lhs.id == rhs.id &&\n        lhs.accountId == rhs.accountId &&\n        lhs.date == rhs.date &&\n        lhs.amount == rhs.amount &&\n        lhs.payeeId == rhs.payeeId &&\n        lhs.categoryId == rhs.categoryId &&\n        lhs.notes == rhs.notes &&\n        lhs.cleared == rhs.cleared &&\n        lhs.reconciled == rhs.reconciled &&\n        lhs.transferId == rhs.transferId &&\n        lhs.isParent == rhs.isParent &&\n        lhs.parentId == rhs.parentId &&\n        lhs.tombstone == rhs.tombstone &&\n        lhs.importedPayee == rhs.importedPayee &&\n        lhs.schedule == rhs.schedule &&\n        lhs.financialId == rhs.financialId &&\n        lhs.startingBalanceFlag == rhs.startingBalanceFlag\n    }\n'''
          new = '''    private static func samePersistedState(_ lhs: Transaction, _ rhs: Transaction) -> Bool {\n        HistoryTransactionSnapshot(lhs).matchesLiveTransaction(rhs)\n    }\n'''
          assert old in text, "observer comparison not found"
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Actuali/Actuali/Services/BudgetStore.swift Actuali/Actuali/Services/HistoryObserver.swift
          git diff --cached --quiet || git commit -m "Fix History transaction publication and undo writes"
          git push origin HEAD:History
